# docker-compose.yml — AuraSense full stack
# "AuraSense: See the air you breathe."
#
# Configuration comes from a .env file next to this one (copy .env.example).
# Secrets are mounted read-only from paths you choose; nothing project-specific
# is hard-coded here.

services:
  backend:
    build:
      context: ./backend
    container_name: aurasense-backend
    ports:
      - "5001:5001"
    volumes:
      - "${GCP_CREDENTIALS_PATH:?Set GCP_CREDENTIALS_PATH in .env}:/app/credentials.json:ro"
      - "${BACKEND_CONFIG_PATH:-./backend/config.json}:/app/config.json:ro"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
      AURASENSE_API_KEY: ${AURASENSE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: aurasense-dashboard
    ports:
      - "8501:8501"
    environment:
      FLASK_URL: http://backend:5001
      AURASENSE_API_KEY: ${AURASENSE_API_KEY:-}
      GCP_PROJECT: ${GCP_PROJECT:?Set GCP_PROJECT in .env}
      BQ_DATASET: ${BQ_DATASET:-iot_data}
      BQ_TABLE: ${BQ_TABLE:-sensor_logs}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - "${GCP_CREDENTIALS_PATH:?Set GCP_CREDENTIALS_PATH in .env}:/app/credentials.json:ro"
    depends_on:
      - backend
    restart: unless-stopped
