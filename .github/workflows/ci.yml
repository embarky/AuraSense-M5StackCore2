# CI — runs on every push and pull request.
#
#   lint       ruff + gitleaks (secret scan of the full history)
#   backend    API, auth, storage, providers, config            (pytest)
#   dashboard  SQLite views, anomaly rules, simulator physics   (pytest)
#   device     firmware compiled and tested on MicroPython
#   demo       builds the three images, runs `docker compose up` and checks
#              that data flows from the simulator to the dashboard

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = Docker image; 3.13 = newest Python without the audioop module
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest==9.2.0
      - run: pytest tests/backend

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt pytest==9.2.0
      - run: pytest tests/dashboard tests/simulator

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q micropython
          pip install mpy-cross==1.29.0.post2
      - run: tests/device/run_device_tests.sh

  demo:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start the local demo
        run: docker compose up -d
      - name: Data flows from simulator to backend and dashboard
        run: |
          key=local-demo-key
          for i in $(seq 1 60); do
            rows=$(curl -sf -H "X-API-Key: $key" "http://localhost:5001/api/history?hours=24" \
                   | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" || echo 0)
            live=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: $key" http://localhost:5001/api/current_status)
            echo "attempt $i: $rows readings in the last 24 h, live status HTTP $live"
            if [ "$rows" -gt 1000 ] && [ "$live" = "200" ]; then break; fi
            sleep 5
          done
          [ "$rows" -gt 1000 ] && [ "$live" = "200" ]
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/api/history)" = "401"
      - name: Container logs
        if: always()
        run: docker compose logs --tail 50
      - name: Stop
        if: always()
        run: docker compose down -v
